[package]
name = "mycelium-std-sys-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Production host wiring: connects the pure std crates' injectable host-source traits (std-rand EntropySource, std-time ClockSource) to the audited mycelium-std-sys OS floor (RFC-0028 §4.5; M-722/M-723)"
publish = false

[features]
# HostCallRegistry install surface (WP-4 / S-HOST-REGISTRY + WP-5 process): depends on
# mycelium-interp's PrimRegistry::register_host API (mycelium-runtime#11). Off by default so pure
# OsEntropy/OsClock consumers stay light.
default = []
host-registry = ["dep:mycelium-interp", "dep:mycelium-core"]

[dependencies]
# The audited OS floor (the only crate that touches the syscalls) …
# Pin includes process::spawn/wait/kill + ProcessTable (WP-5 floor, std-sys#10).
mycelium-std-sys = { git = "https://github.com/tzervas/mycelium-std-sys", rev = "4f4a636540e070b0b1ce4cd39bc6bf80316f38db" }
# … and the pure std crates whose injectable seams this crate fills with the real source.
mycelium-std-rand = { git = "https://github.com/tzervas/mycelium-std-rand", rev = "6cfc39c63db95ab2a39ba2e229933de15fbd4634" }
mycelium-std-time = { git = "https://github.com/tzervas/mycelium-std-time", rev = "180f148134cc8d0750ddf68ca612418c7a4d3713" }

# Feature-gated: HostCallRegistry dispatch table (interp) + Value encoding (core).
# Pin mycelium-interp to mycelium-runtime main tip (HostCallRegistry merged, runtime#11).
mycelium-interp = { git = "https://github.com/tzervas/mycelium-runtime", rev = "7842042d770108b2d179ff2874f1871dc4821604", optional = true }
# Same core rev as mycelium-interp on that tip (encoding helpers + Value construction).
mycelium-core = { git = "https://github.com/tzervas/mycelium-core", rev = "57ef45b453eef1f02bdfb1f0cad1034dabd32b1f", optional = true }

[lints]
workspace = true

# --- standalone workspace root (course-correction Phase B, 2026-07-18; steer handoff §6.2) ---
[workspace]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-std-sys-host"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true
